[project]
name = "mejaar-backend"
version = "0.1.0"
description = "MejaAR backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116,<1",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.14",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-jose[cryptography]>=3.3",
    "argon2-cffi>=23.1",
    "email-validator>=2.2",
    "httpx>=0.28",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.20",
    "itsdangerous>=2.2",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008: call di default argumen = pola standar FastAPI Depends().
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"app/routers/__init__.py" = ["F401"]
"app/__init__.py" = ["F401"]
"tests/conftest.py" = ["F401"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
